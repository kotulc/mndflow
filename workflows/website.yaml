# Websites: pages, the sections inside them, and the paths between them.

name: website

# What this domain calls things. Chips and the object explorer use these
# instead of the generic group/object/relation.
terms:
  group: Section
  node: Page
  relation: Link

# The relation kinds this domain starts with. The list is editable in the
# app; this is only where a new project begins.
relations:
  - links to
  - redirects to
  - embeds
  - submits to

prompts:
  add_root:
    prompt: What pages does the site need?
    hint: One, or several separated by commas. Each becomes a page you can lay out.
    choices: [Home, About, Pricing, Contact]

  add:
    prompt: What sections make up "{label}"?
    hint: Top to bottom, the way a visitor scrolls through it.

  describe:
    prompt: What is "{label}" for, and what does a visitor do there?
    hint: One or two sentences. This becomes the page's brief.

  relate_root:
    prompt: How does a visitor move between these pages?
    hint: For example, "the home page links to pricing".

  relate:
    prompt: Where does "{label}" lead next?
    hint: Name the page, and what makes a visitor go there.
