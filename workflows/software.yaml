# Software systems: modules, what each is responsible for, and what it needs.

name: software

# Starting relations live in packages/core/<name>.yaml. Words live in terms/.
# workflows.ts bridges core into Domain.relations until A0.3 loads packages.

prompts:
  add_root:
    prompt: What are the main parts of this system?
    hint: One per line, or several separated by commas. Each becomes a module.

  add:
    prompt: What is "{label}" made of?
    hint: The pieces inside it, separated by commas. Stop once they are obvious.

  describe:
    prompt: What is "{label}" responsible for?
    hint: One or two sentences. This becomes its specification.

  relate_root:
    prompt: How do these parts depend on one another?
    hint: For example, "the API gateway authenticates via the auth service".

  relate:
    prompt: What does "{label}" depend on?
    hint: Name the other module and what it does for this one.
