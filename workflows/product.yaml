# Product plans: users, the problems they have, and the features that serve
# them. Leads with `describe` — a problem has to be stated before it is split.

name: product

lead: describe

# What this domain calls things. Chips and the object explorer use these
# instead of the generic group/object/relation.
terms:
  group: Area
  node: Feature
  relation: Dependency

prompts:
  add_root:
    prompt: Who is this for, and what do they need?
    hint: One kind of user, or one need, at a time.

  add:
    prompt: What does "{label}" break down into?
    hint: The problems inside it, or the features that serve it.

  describe:
    prompt: What problem does "{label}" solve, and for whom?
    hint: One or two sentences. This becomes its brief.

  relate_root:
    prompt: How do these fit together?
    hint: For example, "onboarding blocks activation".

  relate:
    prompt: What does "{label}" depend on, or unblock?
    hint: Name the other one, and which way the dependency runs.
