# The global operation list. Every domain supplies wording for these and may
# not invent one of its own, so the model is only ever asked to fill the slots
# of a known operation rather than to choose among all of them.
#
# Declared order is the order they are preferred in by default; a domain's
# `lead` promotes one to the front. `when` names the condition under which
# there is anything to ask, evaluated in router.eligible.

name: operations

operations:
  - id: describe
    action: describe
    chip: describe
    # A document that has no text of its own yet.
    when: no_summary

  - id: add
    action: create
    chip: break down
    # The default: there is always something more that could go in, so this is
    # what the conversation returns to between the other two.
    when: always

  - id: relate
    action: relate
    chip: relate
    # Two or more documents in view, so there is something to connect.
    when: has_parts
