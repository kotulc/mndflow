# Creative writing: characters, places, scenes, and what ties them together.
# Leads with `describe` — a character is worth knowing before being broken up.

name: writing

lead: describe

# What this domain calls things. Chips and counts read these, so a domain is
# a file rather than a name the code knows.
terms:
  group: Act
  node: Character
  relation: Connection

prompts:
  add_root:
    prompt: Who and what is this story about?
    hint: Characters, places, objects that matter. Separate several with commas.

  add:
    prompt: What belongs inside "{label}"?
    hint: Scenes, traits, moments — comma separated if there are several.

  describe:
    prompt: Tell me about "{label}".
    hint: Anything you know. This becomes the page for it.

  relate_root:
    prompt: How are these connected?
    hint: For example, "Mira betrays Halloway".

  relate:
    prompt: What is "{label}" to the others?
    hint: Name one, and the tie — "her brother", "arrives after".
