# The catch-all. Plain decomposition, for anything the catalogue does not
# cover — and the fallback whenever a named domain has no file of its own.

name: freeform

# What this domain calls things. Chips and the object explorer use these
# instead of the generic group/object/relation.
terms:
  group: Group
  node: Object
  relation: Relation

# The relation kinds this domain starts with. The list is editable in the
# app; this is only where a new project begins.
relations:
  - relates to
  - depends on
  - contains
  - follows

prompts:
  add_root:
    prompt: What are the main pieces of this?
    hint: Name one, or several separated by commas.

  add:
    prompt: What is "{label}" made of?
    hint: The parts inside it, separated by commas.

  describe:
    prompt: What is "{label}"?
    hint: Whatever you know about it. This becomes its page.

  relate_root:
    prompt: How do these relate to one another?
    hint: Name two, and the link between them.

  relate:
    prompt: What is "{label}" connected to?
    hint: Name the other one, and what the connection is.
