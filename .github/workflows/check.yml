# Typecheck and the suite, on every push and pull request.
#
# The one thing that keeps several streams honest when they merge: a branch that
# compiles and passes alone can still break another, and nobody finds that by
# hand. LFS is skipped — the model is only needed to run the app, not to check it.

name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
