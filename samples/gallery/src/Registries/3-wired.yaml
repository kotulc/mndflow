name: Wired
note: Interface definitions, each in its colour. A port typed by one wears it; Checkout's ports are its uses too.
library:
  interfaces:
    - name: HTTP
      description: Requests and their responses over HTTP.
      settings: { style: { hue: 245 } }
    - name: Events
      description: Messages published for whoever listens.
      settings: { style: { hue: 145 } }
blocks:
  - name: Publisher
    ports:
      - { name: out, type: Events, flow: out }
  - name: Subscriber
    ports:
      - { name: in, type: Events, flow: in }
relations:
  - Publisher::out -> Subscriber::in: events
