name: Estate
type: treemap
description: The gallery as a treemap, each tile as large as what it holds.
note: A treemap layer. Each tile is as large as the block it stands for holds; the groups gather them as the gallery's folders do.
blocks:
  - name: Diagrams
    type: group
    blocks:
      - { type: reference, of: Diagrams::Checkout }
      - { type: reference, of: Diagrams::Payment retry }
      - { type: reference, of: Diagrams::Order states }
      - { type: reference, of: Diagrams::Checkout saga }
      - { type: reference, of: Diagrams::Fulfilment }
  - name: Registries
    type: group
    blocks:
      - { type: reference, of: Registries::Tagged }
      - { type: reference, of: Registries::Owned }
  - name: Visuals
    type: group
    blocks:
      - { type: reference, of: Visuals::Lines }
      - { type: reference, of: Visuals::Groups }
      - { type: reference, of: Visuals::Bands }
      - { type: reference, of: Visuals::Colour }
