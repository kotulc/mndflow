name: Checkout
type: internal
note: An internal diagram, what a block is made of. Its parts meet through typed ports; the room's own port sits on its wall.
blocks:
  - name: Cart
    ports:
      - { name: in, type: HTTP, flow: in }
      - { name: out, type: HTTP, flow: out }
  - name: Pricing
    ports:
      - { name: quote, type: HTTP, flow: in }
  - name: Payment
    tags: [ payments ]
    ports:
      - { name: charge, type: HTTP, flow: in }
      - { name: events, type: Events, flow: out }
  - name: Order log
    ports:
      - { name: events, type: Events, flow: in }
ports:
  - name: https
    type: HTTP
    flow: in
    side: top
    at: 0.5
    note: Public traffic enters here.
relations:
  - https -> Cart::in
  - Cart::out -> Pricing::quote: price
  - Cart::out -> Payment::charge: pay
  - Payment::events -> Order log::events: paid
