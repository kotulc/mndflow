name: Context
packages: [architecture]
settings:
  layout: { kind: layered }
note: The shop seen from outside. Open Containers to go inside.
blocks:
  - name: Customer
    type: person
    tags: [ pii ]
    settings:
      card:
        label: above
  - name: Support agent
    type: person
    settings:
      card:
        label: above
  - name: Shop
    type: reference
    of: System::Containers
  - name: Card processor
    type: external
    tags: [ payments, external api ]
  - name: Carrier
    type: external
    tags: [ fulfilment, external api ]
  - name: Email provider
    type: external
    tags: [ external api, customer facing ]
relations:
  - Customer -> Shop: places orders
  - Support agent -- Shop: looks up orders
  - Shop <-> Card processor: authorize / result
  - Carrier <- Shop: hands over parcels
  - integrates: [ Shop -> Email provider ]
