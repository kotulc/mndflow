name: Bands
note: Regions cut a layer into bands, each under its heading; a region's name tags what lies in it, and a label tags what it is tied to.
blocks:
  - name: Customer facing
    type: region
    blocks: [ Storefront, Gateway ]
  - name: Back office
    type: region
    blocks: [ Order service, Payments ]
  - name: hot path
    type: label
relations:
  - Storefront -> Gateway
  - Order service -> Payments
  - tie: [ hot path -- Gateway ]
