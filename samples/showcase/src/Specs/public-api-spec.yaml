name: Public API spec
type: API spec
def:
  attributes:
    - name: rate limit
      type: number
      unit: req/s
description: An API spec for an API that callers outside the shop reach.
tags: [ critical ]
library:
  tags:
    - name: critical
      description: The shop stops taking orders when this fails.
    - name: customer facing
      description: A customer sees it or what it says.
    - name: orders
      description: Takes part in placing, changing or cancelling an order.
    - name: payments
      description: Moves money or records that it moved.
    - name: pii
      description: Holds or passes personal data; reviewed for every change.
    - name: fulfilment
      description: Gets what was ordered to the customer.
    - name: external api
      description: Speaks to a system the shop does not run.
    - name: async
      description: Works through events rather than waiting on a reply.
    - name: experimental
      description: Planned or trial; may go.
    - name: deprecated
      description: Being retired; nothing new should lean on it.
    - name: audit
      description: Kept for the auditors; nothing reads it yet.
settings:
  style:
    border_width: thick
