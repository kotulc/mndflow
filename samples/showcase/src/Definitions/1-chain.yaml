name: Chain
type: Large layer
blocks:
  - name: A chain of definitions. Open a stand-in for its definition view.
    type: note
    w: 360
  - type: reference
    of: Machine
    note: Machine adds power, and a port.
  - type: reference
    of: Pump
    note: Pump adds flow, ports, the rotating tag and a hue.
  - type: reference
    of: Big pump
    note: Big pump adds stages, and a thick border.
  - name: Compressor
    type: Machine
    power: "30"
    note: A usage answering Machine's power.
  - name: Feed pump
    type: Pump
    power: "15"
    flow: "40"
    note: A usage answering Pump, including what it inherits.
  - name: Main pump
    type: Big pump
    power: "90"
    flow: "200"
    stages: "3"
    note: A usage answering Big pump, down the whole chain.
