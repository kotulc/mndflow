name: Order states
type: state
note: A state machine, ranked by where its lines point. A line back up the ranks still reads the way it points.
blocks:
  - Pending
  - Paid
  - Shipped
  - Delivered
  - Payment failed
  - Cancelled
relations:
  - Pending -> Paid: charged
  - Pending -> Payment failed: declined
  - Payment failed -> Pending: retry
  - Payment failed -> Cancelled: gave up
  - Paid -> Shipped: handed over
  - Shipped -> Delivered: signed for
