name: Estate
type: treemap
description: The shop's diagrams as a treemap, each as large as what it holds.
note: A treemap layer. Each tile is as large as the diagram it stands for holds; the groups gather them as the shop's folders do.
blocks:
  - name: Diagrams
    type: group
    blocks:
      - { type: reference, of: Diagrams::Payment retry }
      - { type: reference, of: Diagrams::Order states }
      - { type: reference, of: Diagrams::Checkout saga }
      - { type: reference, of: Diagrams::Fulfilment }
      - { type: reference, of: Diagrams::Model }
      - { type: reference, of: Diagrams::Schema }
  - name: Flows
    type: group
    blocks:
      - { type: reference, of: Flows::Place order }
  - name: Data
    type: group
    blocks:
      - { type: reference, of: Data::Orders }
      - { type: reference, of: Data::Store }
  - name: System
    type: group
    blocks:
      - { type: reference, of: System::Context }
      - { type: reference, of: System::Containers }
      - { type: reference, of: System::Deployment }
      - { type: reference, of: System::Bands }
  - name: Catalogue
    type: group
    blocks:
      - { type: reference, of: Catalogue::Specs }
      - { type: reference, of: Catalogue::Docs }
