name: Payment retry
type: flow
note: A flowchart. A decision is a block; its lines say where each answer goes.
blocks:
  - name: Charge card
    tags: [ payments, critical ]
  - Approved?
  - Retries left?
  - Wait and back off
  - Confirm order
  - name: Cancel order
    tags: [ orders ]
relations:
  - Charge card -> Approved?
  - Approved? -> Confirm order: yes
  - Approved? -> Retries left?: no
  - Retries left? -> Wait and back off: yes
  - Wait and back off -> Charge card
  - Retries left? -> Cancel order: no
