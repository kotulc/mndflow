name: Swimlane
packages: [diagrams]
blocks:
  - name: "Open Lanes: columns are lanes, rows are phases."
    type: note
    w: 360
  - name: Lanes
    type: diagrams.swimlane
    note: A swimlane opens on the allocation view. The steps say what they do in body.
    cols:
      - name: Left
        body: The first lane.
      - name: Right
        body: The second lane.
    rows:
      - name: One
        body: The first phase.
      - name: Two
        body: The second phase.
    blocks:
      - name: Do
        body: The step in the first lane.
        cell: [ One, Left ]
      - name: Done
        body: The step in the second lane.
        cell: [ Two, Right ]
relations:
  - Do -- Done: then
