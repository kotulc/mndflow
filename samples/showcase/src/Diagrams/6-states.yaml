name: States
settings:
  layout: { kind: layered }
note: A state machine, layered the same way. A line back up the ranks still reads the way it points.
blocks:
  - Idle
  - Running
  - Paused
  - Stopped
relations:
  - Idle -> Running: start
  - Running -> Paused: pause
  - Paused -> Running: resume
  - Running -> Stopped: stop
  - Stopped -> Idle: reset
