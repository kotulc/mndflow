name: Short forms
packages: [architecture]
note: "Written in short forms: a type listing names, A -> B: name, and a relation type listing edges. Its types come from the architecture package."
blocks:
  - Customer
  - service: [Orders, Billing]
  - database: [Ledger]
  - name: Payments
    type: external
    note: The long form says the schema's fields, and any other key is a value.
    region: eu
relations:
  - Customer -> Orders: places
  - calls: [Orders -> Billing, Billing -> Payments]
  - reads: [Billing -> Ledger]
