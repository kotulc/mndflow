name: Ports
blocks:
  - name: Ports placed, and ports that place themselves.
    type: note
    w: 360
  - name: Pump
    note: "Its ports are placed, each with a flow: in, out, both, or none."
    blocks:
      - name: in
        type: interface
        side: left
        at: 0.25
        flow: in
      - name: out
        type: interface
        side: right
        at: 0.25
        flow: out
      - name: top
        type: interface
        side: top
        at: 0.5
        flow: both
      - name: low
        type: interface
        side: bottom
        at: 0.25
  - name: Tank
    note: Its port places itself.
    blocks:
      - name: in
        type: interface
        flow: in
  - name: Valve
    note: Its port places itself, and a line holds it.
    blocks:
      - name: out
        type: interface
        flow: out
  - name: Gauge
    note: Its line meets the room's wall.
  - name: drain
    type: interface
    flow: out
    note: The room's own port, placing itself.
relations:
  - Valve::out -> Pump::low
  - Pump::out -> Tank::in: water
  - Gauge -> Ports: reading
  - Tank -> drain
  - Tank -- Pump: level
