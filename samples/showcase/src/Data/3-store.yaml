name: Store
packages: [architecture]
note: A collection holds many records of one type, drawn as a table on its card. Records are values, never blocks.
blocks:
  - name: Orders
    type: database
    engine: Postgres
    tags: [ orders, pii, critical ]
    settings:
      records: { of: Order }
    records:
      - { number: 1001, customer: Ada, status: paid }
      - { number: 1002, customer: Ada, status: pending }
      - { number: 1003, customer: Grace, status: shipped }
