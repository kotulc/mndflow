name: Orders
type: Large layer
note: Usages answer their record's attributes. Only stored lines draw; a value naming another card draws nothing of itself.
blocks:
  - name: Ada
    type: Customer
    id: "7"
    email: ada@example.com
  - name: Keyboard
    type: Product
    sku: KB-1
    price: "89"
  - name: "1001"
    type: Order
    number: "1001"
    customer: Ada
    status: paid
  - name: 1001 line 1
    type: Line
    product: Keyboard
    qty: "2"
  - name: Charge 1001
    type: Payment
    order: "1001"
    amount: "178"
    result: approved
relations:
  - from: "1001"
    to: 1001 line 1
    settings:
      line:
        from_arrow: diamond
        to_arrow: open
  - 1001 -> Ada: customer
  - 1001 line 1 -> Keyboard: product
  - Charge 1001 -> 1001: order
