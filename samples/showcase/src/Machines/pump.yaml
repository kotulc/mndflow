name: Pump
type: Machine
def:
  attributes:
    - name: flow
      type: number
      unit: m3/h
body: Moves liquid from its inlet to its outlet.
tags: [ rotating ]
settings:
  style:
    hue: 200
blocks:
  - name: inlet
    type: interface
    flow: in
  - name: outlet
    type: interface
    flow: out
  - name: seal
    type: interface
    flow: both
