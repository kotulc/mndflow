name: Lines
blocks:
  - name: "Every line setting: direction, a name, arrows, and a tie."
    type: note
    w: 360
  - From 1
  - name: Forward
    note: line.dir is forward.
  - From 2
  - name: Back
    note: line.dir is back.
  - From 3
  - name: Both
    note: line.dir is both.
  - From 4
  - name: None
    note: line.dir is none.
  - Pump
  - name: Tank
    note: The line's own name is feeds.
  - Whole
  - name: Part
    note: line.from_arrow is diamond and line.to_arrow is open.
  - name: Tied
    note: A tie joins a note to what it is about
  - name: "type is tie, whose is tie trait gives line.module tie: it runs straight, never routed."
    type: note
relations:
  - from: Whole
    to: Part
    settings:
      line:
        from_arrow: diamond
        to_arrow: open
  - From 2 <- Back
  - From 3 <-> Both
  - From 1 -> Forward
  - Pump -> Tank: feeds
  - From 4 -- None
  - tie:
      - "Tied -- type is tie, whose is tie trait gives line.module tie: it runs straight, never routed."
