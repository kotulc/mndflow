name: Grids
blocks:
  - name: A grid seats blocks in cells. The header row and column head the lines, and a merge spans cells. Enter on the grid shows its cells.
    type: note
    w: 360
  - name: Duty roster
    type: Table
    grid:
      merges:
        - r: 1
          c: 1
          rows: 2
          cols: 1
    note: type is Table, which has has_head. Enter shows the cells.
    cols:
      - name: Mon
        body: A column head.
      - name: Tue
        body: A column head.
      - name: Wed
        body: A column head.
    rows:
      - name: Day
        body: A row head.
      - name: Swing
        body: A row head.
      - name: Night
        body: A row head.
    blocks:
      - name: Ana
        body: A cell the merge covers.
        cell: [ Day, Mon ]
      - name: Ben
        body: A cell beside the merge.
        cell: [ Day, Tue ]
      - name: Cy
        body: A cell in the body.
        cell: [ Swing, Wed ]
      - name: Di
        body: A cell in the body.
        cell: [ Night, Tue ]
