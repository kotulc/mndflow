name: Faces
type: Large layer
blocks:
  - name: A layer whose layout.cards is large draws large faces.
    type: note
    w: 360
  - name: Body
    type: Document
    body: |-
      # A heading

      Prose with **bold**, `code` and a [link](https://example.com).

      - a point
      - another point

      | part | qty | note |
      |---|---|---|
      | impeller | 1 | cast |
      | seal | 2 | spare |
    note: card.face is document, and the body is markdown.
  - name: Spec
    type: Spec
    body: Attributes, then the body.
    tag: P-101
    rating: "15"
    duty: continuous
    note: "card.face is table: attributes, then the body."
  - name: Picture
    type: Picture
    source: /showcase/picture.svg
    note: card.face is picture, and source is the file it draws.
  - name: Headless
    type: Headless
    body: "A card that is its markdown alone: no name over it."
    note: "card.name is hide: the name is not drawn."
  - name: Sized
    type: Sized
    body: "A size its definition gives: 8 by 3 units. What does not fit is cut off, however long the text runs on and on."
    note: "card.size is 8 by 3: overflow is cut."
  - name: Plain
    note: "No card.face: the name is the whole card."
