packages: [diagrams]
name: Payment
def:
  attributes:
    - name: order
      type: Order
    - name: amount
      type: number
      unit: USD
    - name: result
      optional: true
description: A charge taken against an order.
settings:
  card:
    face: table
relations:
  - diagrams.association:
      - from: Payment
        to: Records::Order
        ends: { from: { multiplicity: "0..*", role: payments }, to: { multiplicity: "1", role: order } }
