name: Shop
type: internal
description: "The shop itself, one region a side: what customers reach, what runs behind it, the records it keeps, and how it runs."
ports:
  - { name: https, type: services.HTTP, flow: in, side: left }
  - { name: charges, type: services.HTTP, flow: out, side: right }
  - { name: shipments, type: services.HTTP, flow: out, side: right }
blocks:
  - name: Customer facing
    type: region
    blocks:
      - name: Gateway
        type: services.API gateway
        values: { owner: Web }
        tags: [ critical ]
  - name: Back office
    type: region
    blocks:
      - name: Inventory
        type: services.service
        values: { owner: Commerce }
        tags: [ fulfilment ]
        groups: [ fulfilment ]
        ports:
          - { name: events, type: services.Events, flow: in }
      - name: Shipping
        type: services.service
        values: { owner: Logistics }
        tags: [ fulfilment ]
        groups: [ fulfilment ]
        ports:
          - { name: events, type: services.Events, flow: in }
          - { name: carrier, type: services.HTTP, flow: out }
  - name: Data
    type: region
  - name: How it runs
    type: region
  - { name: fulfilment, type: group }
  - name: hot path
    type: label
relations:
  - tie: [ hot path -- Gateway ]
  - https -> Gateway.requests
  - Gateway.routes -> Storefront.https: routes
  - Storefront.pay -> Payments.in: pay
  - Storefront.orders -> Orders.in: placed
  - Payments.remote -> charges
  - Orders.events -> Inventory.events: reserve
  - Orders.events -> Shipping.events: ship
  - Shipping.carrier -> shipments
