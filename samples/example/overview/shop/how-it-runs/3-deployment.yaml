name: Deployment
type: internal
description: "Where the shop runs. Groups nest: each a panel round its members, who carry it, with a note tied beside it; a grid lays environments under their headers."
blocks:
  - name: eu-west cluster
    type: group
    note: One cluster per region.
  - name: shop namespace
    type: group
    note: The services customers reach.
  - name: data namespace
    type: group
  - name: gateway pod
    groups: [ eu-west cluster, shop namespace ]
  - name: storefront pod
    groups: [ eu-west cluster, shop namespace ]
  - name: orders pod
    groups: [ eu-west cluster, shop namespace ]
  - name: orders primary
    groups: [ eu-west cluster, data namespace ]
  - name: orders replica
    groups: [ eu-west cluster, data namespace ]
  - name: Environments
    type: grid
    cols:
      - name: dev
        body: Where changes land first.
      - name: staging
        body: A copy of production.
      - name: prod
        body: What customers reach.
    rows:
      - name: eu-west
      - name: us-east
    blocks:
      - name: shared cluster
        cell: [ eu-west, dev ]
      - name: eu-west prod
        cell: [ eu-west, prod ]
      - name: us-east prod
        cell: [ us-east, prod ]
relations:
  - gateway pod -> storefront pod
  - storefront pod -> orders pod
  - orders pod -> orders primary
  - orders primary -> orders replica: replicates
