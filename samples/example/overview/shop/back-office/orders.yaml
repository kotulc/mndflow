name: Orders
type: Transactional outbox
packages: [ services ]
values: { owner: Commerce }
tags: [ orders ]
description: Keeps every order and tells the rest of the shop when one is placed.
ports:
  - { name: in, type: Events, flow: in, side: left }
blocks:
  - name: Order book
    type: Ledger
    ports:
      - { name: events, type: Events, flow: in }
    records:
      - { number: 1001, customer: Ada, status: paid }
      - { number: 1002, customer: Ada, status: pending }
      - { number: 1003, customer: Grace, status: shipped }
  - name: Runbook
    type: document
    body: |-
      # When orders stop flowing

      Check the **relay** first. See the [outbox pattern](https://microservices.io/patterns/data/transactional-outbox.html).

      | signal | threshold | page |
      |---|---|---|
      | outbox rows | 10 000 | yes |
      | relay lag | 60 s | no |
  - name: Release notes
    type: document
    body: "v2 of the orders API: the checkout key is required."
relations:
  - in -> Order book::events: placed
