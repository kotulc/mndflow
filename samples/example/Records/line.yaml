name: Line
def:
  attributes:
    - name: product
      type: Product
    - name: qty
      type: number
description: One product on an order, and how many.
settings:
  card:
    face: table
relations:
  - association:
      - from: Line
        to: Records::Product
        ends: { from: { multiplicity: "*" }, to: { multiplicity: "1", role: product } }
