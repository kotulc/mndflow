name: Overview
type: model
packages: [ services ]
settings:
  layout: { kind: layered }
note: "One shop, seen from every side: open Shop for its parts, and a part for its own diagram. Every part is a usage of a definition in Parts or Records."
description: "The shop in its world: who uses it and what it leans on. Open Shop to go inside; every diagram here is one side of it."
blocks:
  - name: Customer
    type: person
    ports:
      - { name: browser, type: HTTP, flow: out }
  - name: Card processor
    type: external
    tags: [ external api ]
    ports:
      - { name: api, type: HTTP, flow: in }
  - name: Carrier
    type: external
    tags: [ external api ]
    ports:
      - { name: api, type: HTTP, flow: in }
library:
  tags:
    - name: risk
      description: Needs care whenever it changes.
      settings: { style: { hue: 25 } }
    - name: domain
      description: Which part of the business it serves.
      settings: { style: { hue: 190 } }
    - name: lifecycle
      description: Where it is in its life.
      settings: { style: { hue: 75 } }
    - name: critical
      type: risk
      description: Orders stop when this fails.
    - name: pii
      type: risk
      description: Holds or passes personal data.
    - name: orders
      type: domain
      description: Takes part in placing, changing or cancelling an order.
    - name: payments
      type: domain
      description: Moves money or records that it moved.
    - name: fulfilment
      type: domain
      description: Gets what was ordered to the customer.
    - name: experimental
      type: lifecycle
      description: Planned or trial; may go.
    - name: external api
      description: Speaks to a system nobody here runs.
relations:
  - Customer::browser -> Shop::https: shops
  - Shop::charges -> Card processor::api: charges
  - Shop::shipments -> Carrier::api: books
