# Shipped, locked base definitions — one per block module.
# Every package and project subtype extends one of these.
# `components.block.module` names the module; nothing reads it yet (B.2).

definitions:
  - name: workspace
    form: block
    body: The top-level root — contains projects, packages and folders without owning them; holds the log, metadata and display state.
    components:
      block:
        module: workspace

  - name: project
    form: block
    body: A model that owns a graph of blocks and says nothing about how it is shown.
    components:
      block:
        module: project

  - name: folder
    form: block
    body: Contains anything without owning it — its children are independent roots.
    components:
      block:
        module: folder

  - name: structure
    form: block
    body: What there is, and how it is composed — parts and references.
    components:
      block:
        module: base

  - name: view
    form: block
    body: A perspective holding references to blocks elsewhere — which blocks, through which view module, configured how.
    components:
      block:
        module: view

  - name: resource
    form: block
    body: A workspace-relative path or link — a file, a script, a data file, an image.
    components:
      block:
        module: resource

  - name: group
    form: block
    body: A boundary round a set of references — a swimlane, a region, a package boundary.
    components:
      block:
        module: group

  - name: note
    form: block
    body: Text carried as a resource and drawn as a card.
    components:
      block:
        module: note
