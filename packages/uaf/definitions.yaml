# UAF architecture-layer stereotypes as ordinary definitions.
# Names point at UML / SysML where the concept is the same thing under another
# word. Ornaments and SysML relationships live in packages/sysml — import both.

definitions:
  # ——— strategic ———
  - id: def_capability
    name: capability
    form: block
    body: An ability to achieve a desired effect — strategic layer.
    names:
      uaf: Capability
      sysml: "«capability»"
      uml: Capability
    components:
      card:
        layout: type
      style:
        set: sysml

  - id: def_enterprise_goal
    name: enterprise goal
    form: block
    body: A desired end state for the enterprise.
    names:
      uaf: EnterpriseGoal
      sysml: "«goal»"
    components:
      card:
        layout: fields
        shows:
          - text
    fields:
      - name: text
        form: text

  # ——— operational ———
  - id: def_operational_performer
    name: operational performer
    form: block
    body: Who carries out operational behaviour — a logical actor.
    names:
      uaf: OperationalPerformer
      uml: Actor
      sysml: "«performer»"
    components:
      card:
        layout: type

  - id: def_operational_activity
    name: operational activity
    form: block
    body: A logical process step in the operational layer.
    names:
      uaf: OperationalActivity
      sysml: Action
      uml: Action
    components:
      card:
        layout: type
    # Same shape as a behavior action; refine via extends when both packs load.
    extends: pkg_behavior/def_action

  - id: def_operational_exchange
    name: operational exchange
    form: directed
    body: Information or materiel moving between operational performers.
    line: solid
    head: filled
    names:
      uaf: OperationalExchange
      sysml: "object flow"
      uml: InformationFlow

  # ——— resources ———
  - id: def_resource
    name: resource
    form: block
    body: A physical or system resource that realises a capability.
    names:
      uaf: ResourcePerformer
      sysml: "part def"
      uml: Class
    components:
      card:
        layout: type
      style:
        set: sysml

  - id: def_resource_service
    name: service
    form: block
    body: A unit of functionality offered by a resource.
    names:
      uaf: Service
      sysml: "«service»"
      uml: Interface
    components:
      card:
        layout: type

  # ——— traces across layers ———
  - id: def_exhibits
    name: exhibits
    form: directed
    body: A performer or resource exhibits a capability.
    line: dashed
    head: open
    names:
      uaf: Exhibits
      sysml: "«allocate»"
      uml: Realization

  - id: def_implements
    name: implements
    form: directed
    body: A resource implements an operational performer or activity.
    line: dashed
    head: hollow
    names:
      uaf: Implements
      sysml: "«allocate»"
      uml: Realization

mappings:
  - uaf: Capability
    as: block
    via: def_capability
  - uaf: OperationalPerformer
    as: block
    via: def_operational_performer
  - uaf: OperationalActivity
    as: block extending pkg_behavior/def_action
    via: def_operational_activity
  - uaf: ResourcePerformer
    as: block
    via: def_resource
  - uaf: Exhibits / Implements
    as: directed relationship
    via: def_exhibits / def_implements
  - uaf: control-node ornaments
    as: packages/sysml
    via: pkg_sysml
