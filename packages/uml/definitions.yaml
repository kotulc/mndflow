# UML definitions, formal names, and activity ornaments (shape + size).
# Where a concept is SysML's too, `names.sysml` says so — one definition can
# answer to both vocabularies.

definitions:
  # ——— classifiers & use cases ———
  - id: def_class
    name: class
    form: block
    body: A UML classifier — attributes and operations as fields.
    names:
      uml: Class
      sysml: "part def"
    components:
      card:
        layout: compartments

  - id: def_actor
    name: actor
    form: block
    body: A role outside the system that interacts with it.
    size:
      w: 48
      h: 72
    names:
      uml: Actor
      sysml: "«actor»"
    components:
      card:
        layout: icon
        label: below

  - id: def_use_case
    name: use case
    form: block
    body: A goal a stakeholder can achieve through the system.
    size:
      w: 120
      h: 48
    names:
      uml: UseCase
      sysml: "«useCase»"
    components:
      card:
        layout: shape
        shape: ellipse
        label: inside

  - id: def_package
    name: package
    form: group
    body: A namespace boundary around members.
    names:
      uml: Package
      sysml: Package
    components:
      card:
        layout: name

  # ——— relationships ———
  - id: def_association
    name: association
    form: line
    body: A structural link between classifiers.
    line: solid
    head: none
    names:
      uml: Association
      sysml: Connection

  - id: def_generalization
    name: generalization
    form: directed
    body: A classifier is a kind of another — hollow triangle.
    line: solid
    head: hollow
    names:
      uml: Generalization
      sysml: Specialization

  - id: def_dependency
    name: dependency
    form: directed
    body: A supplier change may affect the client.
    line: dashed
    head: open
    names:
      uml: Dependency
      sysml: Dependency

  - id: def_realization
    name: realization
    form: directed
    body: A classifier realizes a contract.
    line: dashed
    head: hollow
    names:
      uml: Realization
      sysml: Realization

  - id: def_include
    name: include
    form: directed
    body: A use case always includes another.
    line: dashed
    head: open
    names:
      uml: Include
      sysml: "«include»"

  - id: def_extend
    name: extend
    form: directed
    body: A use case conditionally extends another.
    line: dashed
    head: open
    names:
      uml: Extend
      sysml: "«extend»"

  # ——— ornaments (same shapes as packages/sysml) ———
  - id: def_decision
    name: decision
    form: block
    body: A branch in an activity — one in, several guarded outs.
    size:
      w: 48
      h: 48
    names:
      uml: DecisionNode
      sysml: DecisionNode
    components:
      card:
        layout: shape
        shape: diamond
        label: below
      rules:
        degree:
          in: [1, 1]
          out: [2, null]

  - id: def_merge
    name: merge
    form: block
    body: Alternate paths rejoin — several ins, one out.
    size:
      w: 48
      h: 48
    names:
      uml: MergeNode
      sysml: MergeNode
    components:
      card:
        layout: shape
        shape: diamond
        label: below
      rules:
        degree:
          in: [2, null]
          out: [1, 1]

  - id: def_fork
    name: fork
    form: block
    body: Parallel paths begin — a thin bar.
    size:
      w: 96
      h: 12
    names:
      uml: ForkNode
      sysml: ForkNode
    components:
      card:
        layout: shape
        shape: rect
        label: none
      rules:
        degree:
          in: [1, 1]
          out: [2, null]

  - id: def_join
    name: join
    form: block
    body: Parallel paths synchronize — a thin bar.
    size:
      w: 96
      h: 12
    names:
      uml: JoinNode
      sysml: JoinNode
    components:
      card:
        layout: shape
        shape: rect
        label: none
      rules:
        degree:
          in: [2, null]
          out: [1, 1]

  - id: def_initial
    name: initial
    form: block
    body: Where an activity starts — small filled ellipse, no incoming edge.
    size:
      w: 24
      h: 24
    names:
      uml: InitialNode
      sysml: InitialNode
    components:
      card:
        layout: shape
        shape: ellipse
        label: none
      rules:
        degree:
          in: [0, 0]
          out: [1, 1]

  - id: def_final
    name: final
    form: block
    body: Where an activity ends — small ellipse, no outgoing edge.
    size:
      w: 24
      h: 24
    names:
      uml: ActivityFinalNode
      sysml: ActivityFinalNode
    components:
      card:
        layout: shape
        shape: ellipse
        label: none
      rules:
        degree:
          in: [1, null]
          out: [0, 0]

mappings:
  - uml: Class
    as: block
    via: def_class
  - uml: Actor
    as: block + icon card
    via: def_actor
  - uml: UseCase
    as: block + ellipse
    via: def_use_case
  - uml: Package
    as: group
    via: def_package
  - uml: Association
    as: relationship form line
    via: def_association
  - uml: Generalization
    as: directed + hollow head
    via: def_generalization
  - uml: Activity control nodes
    as: ornament defs (shape + size)
    via: def_decision / def_fork / def_initial / …
  - uml: Action / Activity / State
    as: packages/behavior
    via: pkg_behavior
  - uml: ControlFlow / ObjectFlow
    as: packages/flow
    via: pkg_flow
