# Directed relationship subtypes and the plain words for them.
# Form is `directed` (RF.1 retired the old `flow` form). Item flow is a
# field on an object flow, never its own definition — see definitions.md
# under The SysML map.

definitions:
  - id: def_control_flow
    name: control flow
    form: directed
    body: Control passes from one action to the next.
    names:
      sysml: ControlFlow
      uml: ControlFlow

  - id: def_object_flow
    name: object flow
    form: directed
    body: An object or token moves between actions.
    fields:
      - name: item
        form: link
    names:
      sysml: ObjectFlow
      uml: ObjectFlow
      uaf: OperationalExchange

  - id: def_transition
    name: transition
    form: directed
    body: A change of state.
    fields:
      - name: trigger
        form: text
      - name: guard
        form: text
      - name: effect
        form: text
    names:
      sysml: Transition
      uml: Transition
